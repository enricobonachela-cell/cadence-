<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence</title>
<meta name="theme-color" content="#F1F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, fixed tab bar; cards only where items are grouped. */
:root{
  --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg:#F1F2EC; --surface:#FFFFFF; --surface-2:#E7E9E1; --ink:#1A1F1C; --muted:#646C66;
  --faint:#A2A89F; --line:#DCDFD6; --accent:var(--accent-l,#2F5D50); --on-accent:#FFFFFF;
  --danger:#B93C28; --warn:#B7791F; --scrim:rgba(18,22,20,.38);
  --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 20px rgba(20,30,25,.05);
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101311; --surface:#191D1A; --surface-2:#242925; --ink:#E7EBE5; --muted:#9AA39B;
  --faint:#5D655E; --line:#2B312C; --accent:var(--accent-d,#86C4AE); --on-accent:#0E1714;
  --danger:#F07D66; --warn:#E8B154; --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101311; --surface:#191D1A; --surface-2:#242925; --ink:#E7EBE5; --muted:#9AA39B;
  --faint:#5D655E; --line:#2B312C; --accent:var(--accent-d,#86C4AE); --on-accent:#0E1714;
  --danger:#F07D66; --warn:#E8B154; --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:flex-end;gap:12px}
.top .tt{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;margin:2px 0 0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:20px;height:20px}
#view{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head .meta{font-size:13px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.empty{padding:22px 18px;color:var(--muted);font-size:14px;text-align:center}

/* week strip */
.week{display:flex;align-items:center;gap:4px}
.week .days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:14px;color:var(--muted)}
.day .dn{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.day .ringwrap{position:relative;width:34px;height:34px}
.day .ringwrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.day.sel{background:var(--surface);box-shadow:var(--shadow)}
.day.today .dn{color:var(--accent)}
.day.future{opacity:.45}
.chev{width:28px;height:44px;display:grid;place-items:center;color:var(--faint)}
.chev svg{width:18px;height:18px}

/* summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px}
.bigring{position:relative;width:96px;height:96px}
.bigring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.bigring .lbl b{font-family:var(--font-display);font-size:26px;line-height:1;display:block}
.bigring .lbl small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-size:20px;font-family:var(--font-display);font-weight:600}
.kv span{font-size:12px;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.banner p{margin:0;flex:1}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap}

/* habits */
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.hicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;
  background:color-mix(in srgb,var(--hc) 18%,var(--surface))}
.hmain{flex:1;min-width:0}
.hname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hsub svg{width:13px;height:13px;color:var(--hc)}
.hcheck{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  border:2px solid color-mix(in srgb,var(--hc) 45%,var(--line));color:var(--hc);transition:transform .15s}
.hcheck svg.ck{width:20px;height:20px;opacity:0;transform:scale(.6);transition:.18s}
.hcheck.on{background:var(--hc);border-color:var(--hc);color:#fff}
.hcheck.on svg.ck{opacity:1;transform:none}
.hcheck.count{border:0}
.hcheck.count .cnum{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink)}
.hcheck.count.on .cnum{color:#fff}
.hcheck.count.on{background:var(--hc)}
.hminus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);flex:none}
.hminus svg{width:14px;height:14px}
.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.14)}}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:5px;background:var(--surface-2)}
.dots i.on{background:var(--hc)}
.dots i.off{background:transparent;border:1px dashed var(--line)}
.collapse{padding:12px 14px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;width:100%}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px 10px 10px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;font-size:12px;color:var(--muted)}
.mood svg{width:40px;height:40px;transition:transform .15s}
.mood.sel{background:var(--surface-2);color:var(--ink);font-weight:600}
.mood.sel svg{transform:scale(1.1)}
.moodnote{padding:0 14px 14px}

/* tasks */
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;width:100%;text-align:left}
.tbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--pc,var(--faint));flex:none;display:grid;place-items:center;margin-top:1px;color:#fff}
.tbox svg{width:14px;height:14px;opacity:0}
.trow.done .tbox{background:var(--pc,var(--faint));border-color:var(--pc,var(--faint))}
.trow.done .tbox svg{opacity:1}
.trow.done .ttl{color:var(--faint);text-decoration:line-through}
.tmain{flex:1;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.tsub{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.chip.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.chip.acc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.ttime{font-size:13px;font-weight:600;color:var(--accent);flex:none;margin-top:2px}
.quick{display:flex;gap:8px;padding:8px 8px 8px 14px;align-items:center}
.quick input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.quick input::placeholder{color:var(--faint)}
.addbtn{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.addbtn svg{width:18px;height:18px}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.grouphead{padding:14px 14px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list > .grouphead + *{border-top:0}

/* focus */
.timer{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px}
.tring{position:relative;width:min(270px,72vw);aspect-ratio:1;max-width:100%}
.tring svg{width:100%;height:100%}
.tring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tring .clock{font-family:var(--font-display);font-size:clamp(44px,14vw,60px);font-weight:600;letter-spacing:-.03em;line-height:1}
.tring .md{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rounds{display:flex;gap:6px}
.rounds i{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.rounds i.on{background:var(--accent)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:14px;font-weight:600;background:var(--surface-2);color:var(--ink);min-height:46px}
.btn.primary{background:var(--accent);color:var(--on-accent);min-width:140px}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}
.sess{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:14px}
.sess span{color:var(--muted)}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15}
.tile span{font-size:13px;color:var(--muted)}
.tile small{font-size:12px;color:var(--faint)}
.chartcard{padding:16px}
.chartcard h3{margin:0 0 2px;font-size:15px;font-weight:600}
.chartcard p.sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
svg.chart .bar{fill:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
svg.chart .bar.last{fill:var(--accent)}
svg.chart .bar-empty{fill:var(--surface-2)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted);max-width:100%}
.cal .c.x{background:transparent}
.cal .c.fill{color:#fff;font-weight:600}
.cal .c.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .c.nd{background:transparent;border:1px dashed var(--line)}
.cal .c.fut{opacity:.35}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav b{font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rate{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.rate .bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.rate .bar i{display:block;height:100%;background:var(--hc);border-radius:9px}
.rate b{font-size:14px;min-width:42px;text-align:right}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;
  background:var(--bg);border-radius:22px 22px 0 0;animation:up .26s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));flex:none}
.sheet .sb{overflow-y:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet .sh button.x{color:var(--muted);font-weight:600}
.sheet .sh button.save{color:var(--accent);font-weight:700}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.sw svg{width:16px;height:16px;opacity:0}
.sw.on svg{opacity:1}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icongrid button{aspect-ratio:1;border-radius:12px;font-size:22px;background:var(--surface);max-width:100%}
.icongrid button.on{background:color-mix(in srgb,var(--hc) 25%,var(--surface));box-shadow:inset 0 0 0 2px var(--hc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 12px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--line)}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.stepper button{width:42px;height:42px;font-size:20px;color:var(--accent)}
.stepper span{min-width:44px;text-align:center;font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:54px}
.setrow > span{font-weight:500}
.setrow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--surface-2);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.note{font-size:13px;color:var(--muted);margin:0}
.confirm{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px}
ol.steps{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;
  transition:.25s;z-index:60;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--bg);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){ h1{font-size:34px} }
</style>

<div class="app">
  <header class="top">
    <div class="tt"><div class="eyebrow" id="eyebrow"></div><h1 id="title">Today</h1></div>
    <div id="topact"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="sheetroot"></div>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const STORE = 'cadence.v1';
const ACCENTS = {pine:['#2F5D50','#86C4AE'],cobalt:['#2F55C6','#8FA9F5'],plum:['#7B3F7A','#D59BD3'],ember:['#B4542B','#F0A07A'],slate:['#2B3440','#C9D1DB']};
const HCOLORS = ['#E2725B','#E0A030','#8DA63A','#2A9D8F','#3D8BD9','#5C6AC4','#A15CA8','#D9577A'];
const HICONS = ['💧','📚','🏃','🧘','💪','🥗','😴','✍️','🗣️','💊','🚶','🎸','🧹','📵','☀️','🧠','💰','🦷','🌿','🎯','🍎','🚴','🏊','🙏'];

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const todayKey = () => key(new Date());
const kAdd = (k,n) => key(addDays(parse(k),n));
const weekStart = d => addDays(d, -((d.getDay() - S.settings.weekStart + 7) % 7));
const fmtLong = k => parse(k).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const fmtShort = k => parse(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const relDay = k => { const t = todayKey(); if (k===t) return 'Today'; if (k===kAdd(t,1)) return 'Tomorrow'; if (k===kAdd(t,-1)) return 'Yesterday'; return fmtShort(k); };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMin = m => { m = Math.round(m); if (m < 60) return m + 'm'; const h = Math.floor(m/60), r = m%60; return h + 'h' + (r ? ' ' + r + 'm' : ''); };

/* ---------- state ---------- */
function fresh(){
  return {v:1, settings:{name:'',theme:'system',accent:'pine',weekStart:1,focus:{focus:25,short:5,long:15,rounds:4},sound:true,lastBackup:null},
    habits:[], logs:{}, tasks:[], moods:{}, sessions:[], timer:{mode:'focus',endsAt:null,left:null,round:1,label:'',taskId:null}, seeded:false};
}
let S;
let storageOK = true;
try { S = JSON.parse(localStorage.getItem(STORE)); } catch(e) { storageOK = false; }
// Fill in anything missing from saved data (older versions, partial backups) with defaults.
function normalize(d){
  const f = fresh(), out = Object.assign(f, d);
  out.settings = Object.assign(fresh().settings, d.settings || {});
  out.settings.focus = Object.assign(fresh().settings.focus, (d.settings || {}).focus || {});
  out.timer = Object.assign(fresh().timer, d.timer || {});
  ['habits','tasks','sessions'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  ['logs','moods'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = {}; });
  out.habits.forEach(h => { h.freq = Object.assign({type:'daily',days:[],times:3}, h.freq || {}); h.target = h.target || 1; h.unit = h.unit || ''; out.logs[h.id] = out.logs[h.id] || {}; });
  out.tasks.forEach(t => { t.notes = t.notes || ''; t.priority = t.priority || 0; });
  return out;
}
if (!S || S.v !== 1) { S = fresh(); seedExamples(); }
else S = normalize(S);
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(S)); storageOK = true; }
  catch(e){ if (storageOK) toast('Changes can’t be saved in this browser. Export a backup from Settings.'); storageOK = false; }
}

function seedExamples(){
  let a = 20261027; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t = todayKey(), start = kAdd(t,-27);
  const hs = [
    {name:'Drink water',icon:'💧',color:HCOLORS[4],freq:{type:'daily',days:[],times:3},target:8,unit:'glasses',p:.8},
    {name:'Read 20 pages',icon:'📚',color:HCOLORS[0],freq:{type:'daily',days:[],times:3},target:1,unit:'',p:.72},
    {name:'French practice',icon:'🗣️',color:HCOLORS[5],freq:{type:'weekdays',days:[1,2,3,4,5],times:3},target:1,unit:'',p:.78},
    {name:'Gym',icon:'💪',color:HCOLORS[3],freq:{type:'weekly',days:[],times:3},target:1,unit:'',p:.45},
    {name:'Phone away by midnight',icon:'📵',color:HCOLORS[6],freq:{type:'daily',days:[],times:3},target:1,unit:'',p:.6}
  ];
  hs.forEach((h,i) => {
    const id = uid(); const {p, ...rest} = h;
    S.habits.push({id, ...rest, created:start, archived:false, order:i, ex:true});
    S.logs[id] = {};
    for (let k = start; k < t; k = kAdd(k,1)) {
      const hh = S.habits[S.habits.length-1];
      if (!isDue(hh,k) && hh.freq.type !== 'weekly') continue;
      if (rnd() < p) S.logs[id][k] = h.target > 1 ? (rnd() < .8 ? h.target : Math.ceil(h.target*rnd())) : 1;
    }
  });
  S.logs[S.habits[0].id][t] = 3;
  S.habits.forEach(h => h.id);
  const T = (title, date, time, priority, done) => S.tasks.push({id:uid(),title,notes:'',date,time,priority,done:!!done,doneAt:done?t:null,created:t,ex:true});
  T('Review cost accounting notes', t, '10:00', 3);
  T('Macro problem set', t, '16:30', 2);
  T('Reply about the apartment viewing', t, null, 1, true);
  T('Book French oral exam slot', kAdd(t,1), null, 2);
  T('Plan weekend', null, null, 0);
  T('Call home', kAdd(t,-1), null, 1);
  for (let k = start; k < t; k = kAdd(k,1)) {
    if (rnd() < .75) S.moods[k] = {v: Math.min(5, Math.max(1, Math.round(2.6 + rnd()*2.6))), note:'', ex:true};
    if (rnd() < .6) { const n = 1 + Math.floor(rnd()*3); for (let i=0;i<n;i++){ const d = parse(k); d.setHours(9 + i*3, 0); S.sessions.push({id:uid(), start:d.getTime(), mins:25, label:'Study', taskId:null, ex:true}); } }
  }
  S.seeded = true;
}
function clearExamples(){
  const ids = new Set(S.habits.filter(h => h.ex).map(h => h.id));
  S.habits = S.habits.filter(h => !h.ex); ids.forEach(id => delete S.logs[id]);
  S.tasks = S.tasks.filter(x => !x.ex);
  Object.keys(S.moods).forEach(k => { if (S.moods[k].ex) delete S.moods[k]; });
  S.sessions = S.sessions.filter(x => !x.ex);
  S.seeded = false; save(); render(); toast('Example data cleared');

const hasExamples = () => S.habits.some(h=>h.ex) || S.tasks.some(t=>t.ex) || S.sessions.some(s=>s.ex) || Object.values(S.moods).some(m=>m.ex);

/* ---------- habit logic ---------- */
function isDue(h,k){
  if (k < h.created) return false;
  if (h.freq.type === 'weekdays') return h.freq.days.includes(parse(k).getDay());
  return true;
}
const count = (h,k) => (S.logs[h.id] || {})[k] || 0;
const isDone = (h,k) => count(h,k) >= h.target;
function weekDone(h, k, upto){
  const s = weekStart(parse(k)); let c = 0;
  for (let i=0;i<7;i++){ const d = key(addDays(s,i)); if (upto && d > upto) break; if (isDone(h,d)) c++; }
  return c;
}
function streak(h){
  const t = todayKey();
  if (h.freq.type === 'weekly') {
    let s = weekStart(parse(t)), n = 0;
    if (weekDone(h,key(s),t) >= h.freq.times) n++;
    s = addDays(s,-7);
    while (key(addDays(s,6)) >= h.created && weekDone(h,key(s)) >= h.freq.times) { n++; s = addDays(s,-7); }
    return n;
  }
  let k = t, n = 0;
  if (isDue(h,k) && !isDone(h,k)) k = kAdd(k,-1);
  for (let i=0;i<4000 && k >= h.created;i++){
    if (isDue(h,k)) { if (isDone(h,k)) n++; else break; }
    k = kAdd(k,-1);
  }
  return n;
}
function bestStreak(h){
  const t = todayKey(); let best = 0, cur = 0;
  if (h.freq.type === 'weekly') {
    for (let s = weekStart(parse(h.created)); key(s) <= t; s = addDays(s,7)) {
      const met = weekDone(h,key(s),t) >= h.freq.times;
      if (met) { cur++; best = Math.max(best,cur); } else if (key(addDays(s,6)) < t) cur = 0;
    }
    return best;
  }
  for (let k = h.created; k <= t; k = kAdd(k,1)) {
    if (!isDue(h,k)) continue;
    if (isDone(h,k)) { cur++; best = Math.max(best,cur); } else if (k !== t) cur = 0;
  }
  return best;
}
function rate(h, days){
  const t = todayKey();
  if (h.freq.type === 'weekly') {
    let got = 0, need = 0;
    for (let i=0;i<days;i++){ const k = kAdd(t,-i); if (k < h.created) break; if (isDone(h,k)) got++; }
    const weeks = Math.max(1, Math.min(days, Math.floor((parse(t) - parse(h.created))/864e5)+1) / 7);
    need = weeks * h.freq.times;
    return Math.min(1, got/need);
  }
  let due = 0, got = 0;
  for (let i=0;i<days;i++){ const k = kAdd(t,-i); if (k < h.created) break; if (!isDue(h,k)) continue; if (k===t && !isDone(h,k)) continue; due++; if (isDone(h,k)) got++; }
  return due ? got/due : null;
}
const totalDone = h => Object.keys(S.logs[h.id]||{}).filter(k => isDone(h,k)).length;
const active = () => S.habits.filter(h => !h.archived).sort((a,b) => a.order - b.order);
function dayProgress(k){
  const hs = active().filter(h => h.freq.type !== 'weekly' && isDue(h,k));
  return {due: hs.length, done: hs.filter(h => isDone(h,k)).length};
}
function freqText(h){
  if (h.freq.type === 'daily') return 'Every day';
  if (h.freq.type === 'weekly') return `${h.freq.times}× a week`;
  const d = [...h.freq.days].sort((a,b)=>((a-S.settings.weekStart+7)%7)-((b-S.settings.weekStart+7)%7));
  if (d.length === 5 && !d.includes(0) && !d.includes(6)) return 'Weekdays';
  if (d.length === 2 && d.includes(0) && d.includes(6)) return 'Weekends';
  return d.map(x => DOW[x]).join(', ');
}

/* ---------- small renderers ---------- */
function ring(p, size, stroke, color, track){
  const r = (size-stroke)/2, c = 2*Math.PI*r, cc = size/2; p = Math.min(1, Math.max(0, p||0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${cc}" cy="${cc}" r="${r}" fill="none" style="stroke:${track||'var(--surface-2)'}" stroke-width="${stroke}"/>`+
    (p>0 ? `<circle cx="${cc}" cy="${cc}" r="${r}" fill="none" style="stroke:${color||'var(--accent)'};transition:stroke-dashoffset .4s" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p)).toFixed(2)}" transform="rotate(-90 ${cc} ${cc})"/>` : '') + `</svg>`;
}
function face(v, size){
  const m = MOODS[v-1], mouth = {1:'M13 29q7-7 14 0',2:'M13.5 28q6.5-3.5 13 0',3:'M14 27h12',4:'M13.5 25.5q6.5 4 13 0',5:'M13 24q7 8 14 0'}[v];
  return `<svg viewBox="0 0 40 40" width="${size||40}" height="${size||40}" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="${m.c}"/><circle cx="14.5" cy="16.5" r="2.2" fill="#fff"/><circle cx="25.5" cy="16.5" r="2.2" fill="#fff"/><path d="${mouth}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
}
function bars(vals, labels, opts){
  opts = opts || {}; const n = vals.length, W = 320, H = 132, pb = 18, top = 6;
  const gap = n > 14 ? 3 : 8, bw = (W - gap*(n-1)) / n;
  const mx = opts.max || Math.max(1, ...vals.map(v => v||0));
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(opts.aria||'')}">`;
  [.5,1].forEach(f => { const y = top + (H-pb-top)*(1-f); s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`; });
  vals.forEach((v,i) => {
    const x = i*(bw+gap);
    if (v == null || v === 0) s += `<rect x="${x.toFixed(1)}" y="${H-pb-3}" width="${bw.toFixed(1)}" height="3" rx="1.5" class="bar-empty"><title>${esc(labels[i])}: ${v==null?'nothing due':opts.fmt?opts.fmt(0):0}</title></rect>`;
    else { const h = Math.max(4,(H-pb-top)*(v/mx)); s += `<rect x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5,bw/2).toFixed(1)}" class="bar${i===n-1?' last':''}"><title>${esc(labels[i])}: ${opts.fmt?opts.fmt(v):v}</title></rect>`; }
    if (opts.ticks[i]) s += `<text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${esc(opts.ticks[i])}</text>`;
  });
  s += `<text x="${W}" y="${top-1}" text-anchor="end">${esc(opts.topLabel||'')}</text></svg>`;
  return s;
}

      <span class="dn">${DOW[parse(k).getDay()].slice(0,2)}</span>
      <span class="ringwrap">${ring(pr.due ? pr.done/pr.due : 0, 34, 3)}<span class="num">${parse(k).getDate()}</span></span></button>`;
  }
  const pr = dayProgress(d);
  const taskList = tasksForDay(d);
  const tDone = S.tasks.filter(x => x.done && x.doneAt === d).length;

  let html = `<div class="week"><button class="chev" data-act="week" data-n="-7" aria-label="Previous week">${I.left}</button><div class="days">${strip}</div><button class="chev" data-act="week" data-n="7" aria-label="Next week">${I.right}</button></div>`;
  if (!isT) html += `<button class="banner" data-act="day" data-k="${t}"><p>You’re viewing ${relDay(d).toLowerCase() === 'yesterday' ? 'yesterday' : fmtShort(d)}. Changes here update that day.</p><span class="link">Back to today</span></button>`;
  if (hasExamples() && isT) html += `<div class="banner"><p>This is example data so you can see how everything works.</p><button data-act="clear-ex">Clear examples</button></div>`;

  html += `<div class="card summary">
    <div class="bigring">${ring(pr.due ? pr.done/pr.due : 0, 96, 9)}<div class="lbl"><div><b class="num">${pr.done}/${pr.due}</b><small>HABITS</small></div></div></div>

  // habits

  html += `<section class="section"><div class="sec-head"><h2>Habits</h2><button class="link" data-act="habit-new">+ New</button></div><div class="list">`;

  if (notDue.length) {

    if (ui.showNotDue) notDue.forEach(x => html += habitRow(x,d,true));
  }
  html += `</div></section>`;

  // mood
  html += `<section class="section"><div class="sec-head"><h2>Mood</h2><span class="meta">${mood ? 'Logged' : 'How do you feel?'}</span></div><div class="card">
    <div class="moods">${MOODS.map(m => `<button class="mood${mood&&mood.v===m.v?' sel':''}" data-act="mood" data-v="${m.v}" aria-pressed="${!!(mood&&mood.v===m.v)}">${face(m.v)}<span>${m.l}</span></button>`).join('')}</div>
    ${mood ? `<div class="moodnote"><input class="inp" id="moodnote" placeholder="Add a note about your day (optional)" value="${esc(mood.note)}" maxlength="280"></div>` : ''}
  </div></section>`;

  // tasks
  html += `<section class="section"><div class="sec-head"><h2>${isT?'Today’s tasks':'Tasks'}</h2><button class="link" data-act="tab" data-tab="tasks">All tasks</button></div><div class="list">`;
  taskList.forEach(x => html += taskRow(x, d));
  if (!taskList.length) html += `<div class="empty">Nothing planned${isT?' for today':''}.</div>`;
  html += `<form class="quick" data-form="quick" data-date="${d}"><input id="quick-today" placeholder="Add a task for ${isT?'today':relDay(d)}" enterkeyhint="done" autocomplete="off" maxlength="200"><button class="addbtn" aria-label="Add task">${I.plus}</button></form></div></section>`;

  // focus card
  if (isT) {
    const T = S.timer, running = !!T.endsAt;
    html += `<section class="section"><div class="sec-head"><h2>Focus</h2><span class="meta num">${fmtMin(fMin)} today</span></div>
      <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px">
        <div style="flex:1;min-width:0"><div style="font-weight:600">${running ? modeName(T.mode) + ' running' : T.left!=null ? 'Paused' : 'Ready when you are'}</div>
        <div class="hsub num" id="focusmini">${running||T.left!=null ? clock(remaining()) + ' left' : S.settings.focus.focus + '-minute session'}</div></div>
        <button class="btn primary" style="min-width:0" data-act="tab" data-tab="focus">${running||T.left!=null?'Open':'Start'}</button></div></section>`;
  }
  return html;
}
function habitRow(h, d, dim){
  const c = count(h,d), done = c >= h.target, fut = d > todayKey();
  let sub = '';
  if (h.freq.type === 'weekly') {
    const wd = weekDone(h,d,d >todayKey()? d : todayKey());
    const st = streak(h);
    sub = `<span class="num">${wd}/${h.freq.times} this week</span>` + (st ? ` · ${I.flame}<span class="num">${st} wk</span>` : '');
  } else {
    const st = streak(h);
    if (h.target > 1) sub = `<span class="num">${c}/${h.target}${h.unit?' '+esc(h.unit):''}</span>` + (st ? ` · ${I.flame}<span class="num">${st}</span>` : '');
    else sub = st ? `${I.flame}<span class="num">${st}-day streak</span>` : `<span>${esc(freqText(h))}</span>`;
  }
  const btn = h.target > 1
    ? `<button class="hcheck count${done?' on':''}" data-act="habit-tap" data-id="${h.id}" data-k="${d}" aria-label="Add one to ${esc(h.name)}" ${fut||dim?'disabled':''}>${done ? I.check.replace('class="ck"','class="ck" style="opacity:1;transform:none"') : ring(c/h.target, 42, 3.5, 'var(--hc)') + `<span class="cnum num">${c}</span>`}</button>`
    : `<button class="hcheck${done?' on':''}" data-act="habit-tap" data-id="${h.id}" data-k="${d}" aria-label="Mark ${esc(h.name)} done" aria-pressed="${done}" ${fut||dim?'disabled':''}>${I.check}</button>`;
  const minus = h.target > 1 && c > 0 && !fut ? `<button class="hminus" data-act="habit-minus" data-id="${h.id}" data-k="${d}" aria-label="Remove one">${I.minus}</button>` : '';
  return `<div class="hrow" style="--hc:${h.color};${dim?'opacity:.55':''}" data-act="habit-open" data-id="${h.id}" role="button" tabindex="0">
    <span class="hicon">${esc(h.icon)}</span><div class="hmain"><div class="hname">${esc(h.name)}</div><div class="hsub">${sub}</div></div>${minus}${btn}</div>`;
}

function tasksForDay(d){
  const t = todayKey();
  return S.tasks.filter(x => x.date === d || (d === t && !x.done && x.date && x.date < t) || (x.done && x.doneAt === d && x.date !== d && d === t && false))
    .sort(taskSort);
}
function taskSort(a,b){
  if (a.done !== b.done) return a.done ? 1 : -1;
  if ((a.date||'9') !== (b.date||'9') && (a.date < todayKey() || b.date < todayKey())) return (a.date||'9') < (b.date||'9') ? -1 : 1;
  if (!!a.time !== !!b.time) return a.time ? -1 : 1;
  if (a.time && b.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
  return b.priority - a.priority || (a.created < b.created ? -1 : 1);
}
function taskRow(x, ctxDay){
  const t = todayKey(), late = !x.done && x.date && x.date < t;
  const chips = [];
  if (late) chips.push(`<span class="chip late">${relDay(x.date)}</span>`);
  else if (x.date && x.date !== ctxDay) chips.push(`<span class="chip">${relDay(x.date)}</span>`);
  if (x.priority) chips.push(`<span class="chip" style="color:${PRIO[x.priority].c}">${PRIO[x.priority].l}</span>`);
  if (x.notes) chips.push(`<span class="chip" aria-label="Has notes">Notes</span>`);
  return `<div class="trow${x.done?' done':''}" style="--pc:${PRIO[x.priority].c||'var(--faint)'}" data-act="task-open" data-id="${x.id}" role="button" tabindex="0">
    <button class="tbox" data-act="task-toggle" data-id="${x.id}" aria-label="${x.done?'Mark not done':'Complete'}: ${esc(x.title)}" aria-pressed="${x.done}">${I.check}</button>
    <div class="tmain"><div class="ttl">${esc(x.title)}</div>${chips.length?`<div class="tsub">${chips.join('')}</div>`:''}</div>
    ${x.time ? `<span class="ttime num">${x.time}</span>` : ''}</div>`;
}

function viewHabits(){
  setHeader(`${active().length} active`, 'Habits', `<button class="iconbtn" data-act="habit-new" aria-label="New habit" style="color:var(--accent)">${I.plus}</button>`);
  const t = todayKey(), hs = active(), arch = S.habits.filter(h => h.archived);
  let html = '';
  if (!hs.length) html += `<div class="card empty">Build your first habit. Small and specific works best, like “Read 10 pages” or “Walk after lunch”.<br><br><button class="btn primary" data-act="habit-new">New habit</button></div>`;
  else {
    html += `<div class="list">`;
    hs.forEach(h => {
      const st = streak(h), r = rate(h,30);
      let dots = '';
      for (let i=6;i>=0;i--){ const k = kAdd(t,-i); const cls = k < h.created ? 'off' : (h.freq.type!=='weekly' && !isDue(h,k)) ? 'off' : isDone(h,k) ? 'on' : ''; dots += `<i class="${cls}" title="${fmtShort(k)}"></i>`; }
      html += `<div class="hrow" style="--hc:${h.color}" data-act="habit-open" data-id="${h.id}" role="button" tabindex="0">
        <span class="hicon">${esc(h.icon)}</span>
        <div class="hmain"><div class="hname">${esc(h.name)}</div><div class="hsub"><span>${esc(freqText(h))}</span>${h.target>1?` · <span class="num">${h.target} ${esc(h.unit||'times')}</span>`:''}</div><div class="dots">${dots}</div></div>
        <div style="text-align:right;flex:none"><div style="font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--hc)" class="num">${st}</div><div class="hsub" style="justify-content:flex-end">${h.freq.type==='weekly'?'wk streak':'streak'}</div><div class="hsub num" style="justify-content:flex-end">${r==null?'–':Math.round(r*100)+'%'} · 30d</div></div>
      </div>`;
    });
    html += `</div>`;
  }
  if (arch.length) {
    html += `<section class="section"><div class="list"><button class="collapse" data-act="toggle-arch"><span>Archived · ${arch.length}</span><span>${ui.showArchived?'Hide':'Show'}</span></button>`;
    if (ui.showArchived) arch.forEach(h => html += `<div class="hrow" style="--hc:${h.color};opacity:.7" data-act="habit-open" data-id="${h.id}" role="button" tabindex="0"><span class="hicon">${esc(h.icon)}</span><div class="hmain"><div class="hname">${esc(h.name)}</div><div class="hsub">Best streak ${bestStreak(h)}</div></div></div>`);
    html += `</div></section>`;
  }
  return html;
}

function viewTasks(){
  const t = todayKey();
  const open = S.tasks.filter(x => !x.done);
  setHeader(`${open.length} open`, 'Tasks', `<button class="iconbtn" data-act="task-new" aria-label="New task" style="color:var(--accent)">${I.plus}</button>`);
  const segs = [['today','Today'],['upcoming','Upcoming'],['anytime','Anytime'],['done','Done']];
  let html = `<div class="seg" role="tablist">${segs.map(([k,l]) => `<button role="tab" aria-selected="${ui.seg===k}" class="${ui.seg===k?'on':''}" data-act="seg" data-seg="${k}">${l}</button>`).join('')}</div>`;
  let list = [], groups = null;
  if (ui.seg === 'today') list = S.tasks.filter(x => (!x.done && x.date && x.date <= t) || (x.date === t)).sort(taskSort);
  if (ui.seg === 'anytime') list = S.tasks.filter(x => !x.done && !x.date).sort(taskSort);
  if (ui.seg === 'done') list = S.tasks.filter(x => x.done).sort((a,b) => (b.doneAt||'') < (a.doneAt||'') ? -1 : 1).slice(0,100);
  if (ui.seg === 'upcoming') {
    groups = {};
    S.tasks.filter(x => !x.done && x.date && x.date > t).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : taskSort(a,b)).forEach(x => (groups[x.date] = groups[x.date] || []).push(x));
  }
  html += `<div class="list">`;
  if (groups) {
    const ks = Object.keys(groups);
    if (!ks.length) html += `<div class="empty">No upcoming tasks. Give a task a date to see it here.</div>`;
    ks.forEach(k => { html += `<div class="grouphead">${relDay(k)}</div>`; groups[k].forEach(x => html += taskRow(x,k)); });
  } else {
    if (!list.length) html += `<div class="empty">${{today:'All clear for today.',anytime:'Tasks without a date land here.',done:'Completed tasks will show here.'}[ui.seg]}</div>`;
    let lastDone = null;
    list.forEach(x => { if (ui.seg==='done' && x.doneAt !== lastDone) { lastDone = x.doneAt; html += `<div class="grouphead">${x.doneAt?relDay(x.doneAt):'Earlier'}</div>`; } html += taskRow(x, ui.seg==='today'?t:x.date); });
  }
  if (ui.seg !== 'done') {
    const dd = ui.seg === 'today' ? t : ui.seg === 'upcoming' ? kAdd(t,1) : '';
    html += `<form class="quick" data-form="quick" data-date="${dd}"><input id="quick-tasks" placeholder="${ui.seg==='upcoming'?'Add a task for tomorrow':ui.seg==='today'?'Add a task for today':'Add a task'}" enterkeyhint="done" autocomplete="off" maxlength="200"><button class="addbtn" aria-label="Add task">${I.plus}</button></form>`;
  } else if (list.length) html += `<button class="collapse" data-act="clear-done" style="color:var(--danger)"><span>Clear completed tasks</span></button>`;
  html += `</div>`;
  return html;
}

/* focus */
const modeName = m => ({focus:'Focus',short:'Short break',long:'Long break'})[m];
const dur = m => S.settings.focus[m] * 60000;
function remaining(){ const T = S.timer; if (T.endsAt) return Math.max(0, T.endsAt - Date.now()); if (T.left != null) return T.left; return dur(T.mode); }
const clock = ms => { const s = Math.ceil(ms/1000); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; };
function focusMin(k){ return S.sessions.filter(s => key(new Date(s.start)) === k).reduce((a,s) => a + s.mins, 0); }
function viewFocus(){
  const T = S.timer, running = !!T.endsAt, paused = !running && T.left != null;
  setHeader(`Round ${T.round} of ${S.settings.focus.rounds}`, 'Focus', gearBtn);
  const rem = remaining(), p = 1 - rem / dur(T.mode);
  const openTasks = S.tasks.filter(x => !x.done && (!x.date || x.date <= kAdd(todayKey(),1))).sort(taskSort).slice(0,30);
  let html = `<div class="seg">${['focus','short','long'].map(m => `<button class="${T.mode===m?'on':''}" data-act="mode" data-m="${m}" ${running||paused?'disabled':''}>${modeName(m)}</button>`).join('')}</div>
  <div class="card timer">
    <div class="tring">${ring(p, 280, 10, T.mode==='focus'?'var(--accent)':'#5FA374').replace('<svg ','<svg id="tsvg" ')}
      <div class="in"><span class="md">${modeName(T.mode)}</span><span class="clock num" id="tclock">${clock(rem)}</span>
      <div class="rounds">${Array.from({length:S.settings.focus.rounds},(_,i)=>`<i class="${i < T.round - (T.mode==='focus'?1:0) || (i===T.round-1 && T.mode!=='focus')?'on':''}"></i>`).join('')}</div></div></div>
    <div class="btns">
      ${running ? `<button class="btn primary" data-act="t-pause">Pause</button>` : `<button class="btn primary" data-act="t-start">${paused?'Resume':'Start'}</button>`}
      ${(running||paused) ? (T.mode==='focus' ? `<button class="btn" data-act="t-stop">Log & stop</button>` : `<button class="btn" data-act="t-skip">Skip break</button>`) : ''}
      ${(running||paused) ? `<button class="btn danger" data-act="t-reset">Discard</button>` : ''}
    </div>
  </div>`;
  if (T.mode === 'focus') html += `<section class="section"><div class="field"><span>Working on</span>
    <input class="inp" id="tlabel" placeholder="What are you focusing on?" value="${esc(T.label)}" maxlength="80"></div>
    ${openTasks.length ? `<div class="chips">${openTasks.slice(0,6).map(x => `<button class="${T.taskId===x.id?'on':''}" data-act="t-task" data-id="${x.id}">${esc(x.title.length>28?x.title.slice(0,27)+'…':x.title)}</button>`).join('')}</div>` : ''}</section>`;
  const today = S.sessions.filter(s => key(new Date(s.start)) === todayKey()).sort((a,b)=>b.start-a.start);
  html += `<section class="section"><div class="sec-head"><h2>Today’s sessions</h2><span class="meta num">${fmtMin(focusMin(todayKey()))}</span></div><div class="list">`;
  if (!today.length) html += `<div class="empty">Finished sessions are logged here.</div>`;
  today.forEach(s => html += `<div class="sess"><div style="min-width:0"><b style="font-weight:600">${esc(s.label || 'Focus session')}</b></div><span class="num">${new Date(s.start).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${s.mins} min</span></div>`);
  html += `</div><p class="note">Keep the app open while the timer runs. If you leave it, the time keeps counting and the session is logged when you come back.</p></section>`;
  return html;
}

function viewStats(){
  const t = todayKey(), n = ui.range;
  setHeader(n === 7 ? 'Last 7 days' : 'Last 30 days', 'Stats', gearBtn);
  const ks = Array.from({length:n}, (_,i) => kAdd(t, i-n+1));
  const rates = ks.map(k => { const p = dayProgress(k); return p.due ? p.done/p.due : null; });
  const fm = ks.map(focusMin);
  const done = ks.reduce((a,k) => a + active().filter(h => isDone(h,k)).length, 0);
  const valid = rates.filter(r => r != null);
  const avg = valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : 0;
  const tasksDone = S.tasks.filter(x => x.done && x.doneAt && x.doneAt >= ks[0]).length;
  const totalF = fm.reduce((a,b)=>a+b,0);
  const ticks = ks.map((k,i) => n === 7 ? DOW[parse(k).getDay()].slice(0,2) : (i%7===0||i===n-1) ? String(parse(k).getDate()) : '');
  const labels = ks.map(fmtShort);
  const moodVals = ks.map(k => S.moods[k]?.v).filter(Boolean);
  const best = active().map(h => ({h, s:streak(h)})).sort((a,b)=>b.s-a.s)[0];

  let html = `<div class="seg"><button class="${n===7?'on':''}" data-act="range" data-n="7">Week</button><button class="${n===30?'on':''}" data-act="range" data-n="30">Month</button></div>
  <div class="tiles">
    <div class="tile"><span>Completion</span><b class="num">${Math.round(avg*100)}%</b><small>average daily habits</small></div>
    <div class="tile"><span>Check-ins</span><b class="num">${done}</b><small>habits completed</small></div>
    <div class="tile"><span>Focus</span><b class="num">${fmtMin(totalF)}</b><small>${S.sessions.filter(s=>key(new Date(s.start))>=ks[0]).length} sessions</small></div>
    <div class="tile"><span>Tasks</span><b class="num">${tasksDone}</b><small>completed</small></div>
  </div>
  <div class="card chartcard"><h3>Daily habit completion</h3><p class="sub">Share of scheduled habits finished each day</p>${bars(rates.map(r=>r==null?null:r*100), labels, {max:100, ticks, fmt:v=>Math.round(v)+'%', topLabel:'100%', aria:'Daily habit completion'})}</div>
  <div class="card chartcard"><h3>Focus time</h3><p class="sub">Minutes logged per day${totalF?` · peak ${fmtMin(Math.max(...fm))}`:''}</p>${bars(fm, labels, {ticks, fmt:v=>fmtMin(v), topLabel:fmtMin(Math.max(60,...fm)), max:Math.max(60,...fm), aria:'Focus minutes per day'})}</div>`;

  // mood calendar
  const mm = ui.moodMonth || t.slice(0,7);
  const [yy,mo] = mm.split('-').map(Number), first = new Date(yy, mo-1, 1), days = new Date(yy, mo, 0).getDate();
  const lead = (first.getDay() - S.settings.weekStart + 7) % 7;
  let cal = Array.from({length:7},(_,i)=>`<div class="h">${DOW[(i+S.settings.weekStart)%7].slice(0,1)}</div>`).join('');
  for (let i=0;i<lead;i++) cal += `<div class="c x"></div>`;
  const monthMoods = [];
  for (let d=1; d<=days; d++){ const k = `${yy}-${pad(mo)}-${pad(d)}`, m = S.moods[k]; if (m) monthMoods.push(m.v);
    cal += `<div class="c num${m?' fill':''}${k===t?' today':''}${k>t?' fut':''}" ${m?`style="background:${MOODS[m.v-1].c}" title="${fmtShort(k)}: ${MOODS[m.v-1].l}${m.note?' – '+esc(m.note):''}"`:''}>${d}</div>`; }
  const mAvg = monthMoods.length ? monthMoods.reduce((a,b)=>a+b,0)/monthMoods.length : null;
  html += `<div class="card chartcard"><div class="calnav"><button class="chev" data-act="mood-month" data-n="-1" aria-label="Previous month">${I.left}</button><div style="text-align:center"><b>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><div class="hsub" style="justify-content:center">${mAvg?`Mood average ${MOODS[Math.round(mAvg)-1].l.toLowerCase()} · ${monthMoods.length} check-ins`:'No mood check-ins'}</div></div><button class="chev" data-act="mood-month" data-n="1" aria-label="Next month" ${mm>=t.slice(0,7)?'disabled':''}>${I.right}</button></div>
    <div class="cal">${cal}</div><div class="legend">${MOODS.map(m=>`<span><i style="background:${m.c}"></i>${m.l}</span>`).join('')}</div></div>`;

  // per-habit
  const hs = active();
  if (hs.length) {
    html += `<section class="section"><div class="sec-head"><h2>By habit</h2><span class="meta">${n}-day rate</span></div><div class="list">`;
    hs.map(h => ({h, r:rate(h,n)})).sort((a,b)=>(b.r??-1)-(a.r??-1)).forEach(({h,r}) => {
      html += `<div class="rate" style="--hc:${h.color}" data-act="habit-open" data-id="${h.id}" role="button" tabindex="0"><span class="hicon" style="width:32px;height:32px;font-size:16px;border-radius:10px">${esc(h.icon)}</span>
        <div style="min-width:0"><div class="hname" style="font-size:14px">${esc(h.name)}</div><div class="bar"><i style="width:${Math.round((r||0)*100)}%"></i></div></div><b class="num">${r==null?'–':Math.round(r*100)+'%'}</b></div>`;
    });
    html += `</div></section>`;
  }
  if (best && best.s) html += `<p class="note">Longest running streak: ${esc(best.h.icon)} ${esc(best.h.name)}, ${best.s} ${best.h.freq.type==='weekly'?'weeks':'days'}. ${moodVals.length?`You logged your mood on ${moodVals.length} of the last ${n} days.`:''}</p>`;
  return html;
}

/* ---------- sheets ---------- */
function openSheet(type, data){ ui.sheet = {type, data}; ui.confirm = null; renderSheet(); }
function closeSheet(){ ui.sheet = null; ui.confirm = null; document.getElementById('sheetroot').innerHTML = ''; }
function renderSheet(){
  const root = document.getElementById('sheetroot');
  if (!ui.sheet) { root.innerHTML = ''; return; }
  const scroll = root.querySelector('.sb')?.scrollTop || 0;
  const fn = {habitEdit:sheetHabitEdit, habitView:sheetHabitView, taskEdit:sheetTaskEdit, settings:sheetSettings}[ui.sheet.type];
  const [title, body, right] = fn(ui.sheet.data);
  const had = !!root.querySelector('.sheet');
  root.innerHTML = `<div class="scrim" data-act="close"${had?' style="animation:none"':''}></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"${had?' style="animation:none"':''}>
    <div class="grab"></div><div class="sh"><button class="x" data-act="close">${right && ui.sheet.type !== 'habitView' ? 'Cancel' : 'Close'}</button><h2 style="font-size:17px">${esc(title)}</h2>${right || '<span style="width:44px"></span>'}</div><div class="sb">${body}</div></div>`;
  const sb = root.querySelector('.sb'); if (sb) sb.scrollTop = scroll;
}

function sheetHabitEdit(dr){

  const f = dr.freq;
  const icons = HICONS.includes(dr.icon) ? HICONS : [dr.icon, ...HICONS];
  const ordered = Array.from({length:7},(_,i)=>(i+S.settings.weekStart)%7);
  const body = `
    <label class="field"><span>Name</span><input class="inp" id="h-name" value="${esc(dr.name)}" placeholder="e.g. Read 20 pages" maxlength="60" autocomplete="off"></label>
    <div class="field" style="--hc:${dr.color}"><span>Icon</span><div class="icongrid">${icons.map(ic => `<button class="${ic===dr.icon?'on':''}" data-act="h-icon" data-v="${esc(ic)}" aria-label="Icon ${esc(ic)}">${esc(ic)}</button>`).join('')}</div>
      <input class="inp" id="h-icon-custom" placeholder="Or type any emoji" maxlength="4" style="width:180px" autocomplete="off"></div>

function applyTheme(){

let toastT;
function toast(msg, undo){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;

  // settings
  's-theme': el => { syncSettingsName(); S.settings.theme = el.dataset.v; save(); applyTheme(); renderSheet(); },
  's-accent': el => { syncSettingsName(); S.settings.accent = el.dataset.v; save(); applyTheme(); renderSheet(); },
  's-week': el => { syncSettingsName(); S.settings.weekStart = +el.dataset.v; save(); render(); },
  's-sound': () => { syncSettingsName(); S.settings.sound = !S.settings.sound; save(); renderSheet(); },
  'f-step': el => { syncSettingsName(); const f = S.settings.focus, k = el.dataset.k, lim = {focus:[5,120],short:[1,30],long:[5,60],rounds:[2,8]}[k];
    f[k] = Math.min(lim[1], Math.max(lim[0], f[k] + (+el.dataset.v))); save(); render(); },
  export: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cadence-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    S.settings.lastBackup = Date.now(); save(); renderSheet(); toast('Backup downloaded');
  },
  'copy-backup': () => { const txt = JSON.stringify(S);
    const done = () => { S.settings.lastBackup = Date.now(); save(); renderSheet(); toast('Backup copied'); };
    try { navigator.clipboard.writeText(txt).then(done, () => toast('Copy was blocked. Use Download instead.')); } catch(e){ toast('Copy was blocked. Use Download instead.'); } },
  'reset-all': () => { const name = S.settings.name; S = fresh(); S.settings.name = name; save(); closeSheet(); applyTheme(); render(); toast('All data erased'); },
  undo: () => { const u = toast.undo; toast.undo = null; document.getElementById('toast').classList.remove('show'); if (u) u(); }
};
function syncSettingsName(){ const n = document.getElementById('s-name'); if (n) S.settings.name = n.value.trim(); }
function syncLabel(){ const l = document.getElementById('tlabel'); if (l) S.timer.label = l.value.trim(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (f.dataset.form !== 'quick') return; e.preventDefault();
  const inp = f.querySelector('input'), title = inp.value.trim(); if (!title) return;
  S.tasks.push({id:uid(), title, notes:'', date: f.dataset.date || null, time:null, priority:0, done:false, doneAt:null, created:todayKey()});
  save(); inp.value = ''; render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'moodnote' && S.moods[ui.day]) { S.moods[ui.day].note = t.value.trim(); save(); toast('Note saved'); }
  if (t.id === 'tlabel') { S.timer.label = t.value.trim(); save(); }
  if (t.id === 's-name') { S.settings.name = t.value.trim(); save(); render(); }
  if (t.id === 't-datepick') { syncTaskDraft(); renderSheet(); }
  if (t.id === 'importfile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.v !== 1 || !Array.isArray(d.habits)) throw 0;
        S = normalize(d);
        save(); applyTheme(); closeSheet(); render(); toast('Backup restored'); }
      catch(err){ toast('That file isn’t a Cadence backup'); } };
    r.readAsText(t.files[0]);
  }
});

/* ---------- timer engine ---------- */
let actx;
function unlockAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function chime(){
  if (!S.settings.sound || !actx) return;
  try { [0, .22, .44].forEach((t,i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = [659.25, 783.99, 1046.5][i];
    g.gain.setValueAtTime(0.0001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + .9);
    o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 1); }); } catch(e){}
}
function askNotify(){ try { if ('Notification' in window && Notification.permission === 'default' && (matchMedia('(display-mode: standalone)').matches || navigator.standalone)) Notification.requestPermission(); } catch(e){} }
function notify(title, body){
  try { if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:'icon-192.png', tag:'cadence-timer'}));
    else new Notification(title, {body}); } catch(e){}
}
let wl = null;
async function wake(on){ try { if (on && 'wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } else if (!on && wl) { await wl.release(); wl = null; } } catch(e){ wl = null; } }
function logSession(mins, start){ const T = S.timer; S.sessions.push({id:uid(), start, mins, label:T.label || (T.taskId ? (S.tasks.find(x=>x.id===T.taskId)||{}).title : '') || '', taskId:T.taskId}); }
function nextMode(){
  const T = S.timer, f = S.settings.focus;
  if (T.mode === 'focus') T.mode = T.round >= f.rounds ? 'long' : 'short';
  else { T.round = T.mode === 'long' ? 1 : T.round + 1; T.mode = 'focus'; }
  T.endsAt = null; T.left = null; T.startedAt = null;
}
function finishTimer(){
  const T = S.timer, endAt = T.endsAt, was = T.mode;
  if (was === 'focus') logSession(S.settings.focus.focus, endAt - dur('focus'));
  nextMode(); save(); wake(false); chime();
  const msg = was === 'focus' ? `Nice work. Time for a ${T.mode === 'long' ? 'long' : 'short'} break.` : 'Break’s over. Ready for the next round?';
  notify(was === 'focus' ? 'Focus session complete' : 'Break finished', msg);
  if (document.visibilityState === 'visible') toast(msg);
  render();
}
function tick(){
  const T = S.timer;
  if (T.endsAt) {
    const rem = remaining();
    if (rem <= 0) return finishTimer();
    const c = document.getElementById('tclock'); if (c) c.textContent = clock(rem);
    const mini = document.getElementById('focusmini'); if (mini) mini.textContent = clock(rem) + ' left';
    const svg = document.getElementById('tsvg');
    if (svg) { const arc = svg.querySelectorAll('circle')[1]; if (arc) { const len = +arc.getAttribute('stroke-dasharray'); arc.setAttribute('stroke-dashoffset', (len * (rem / dur(T.mode))).toFixed(2)); } else if (rem < dur(T.mode) - 1500) render(); }
    document.title = `${clock(rem)} · ${modeName(T.mode)}`;
  } else if (document.title !== 'Cadence') document.title = 'Cadence';
}
setInterval(tick, 500);

/* ---------- day rollover & lifecycle ---------- */
let lastDay = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (todayKey() !== lastDay) { if (ui.day === lastDay) ui.day = todayKey(); lastDay = todayKey(); render(); }
  if (S.timer.endsAt) { tick(); wake(true); }
});
setInterval(() => { if (todayKey() !== lastDay) { if (ui.day === lastDay) ui.day = todayKey(); lastDay = todayKey(); render(); } }, 60000);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------- boot ---------- */
applyTheme();
if (S.timer.endsAt && remaining() <= 0) finishTimer();
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window.self) navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(e){}
window.__cadence = { get state(){ return S; } };
})();
</script>
